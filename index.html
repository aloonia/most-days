<style>
:root {
  --ink: #111111; --paper: #F5F4F0; --white: #FFFFFF; --muted: #62615C; --line: #E3E1DA; --soft: #EDEBE5;
  --green: #6DB33F; --leaf-dark: #2F6B22; --leaf-soft: #EAF4E2; --serif: Newsreader, Georgia, serif; --run: #D1495B; --str: #4B3FA8; --swim: #0E8F9C; --cal: #2F4E7C;
  --top: env(safe-area-inset-top, 0px); --bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--ink); }
body { font-family: Figtree, system-ui, -apple-system, sans-serif; color: var(--ink); font-size: 16px; line-height: 1.45; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }
.ph { line-height: 1; }

#stage { min-height: 100%; display: flex; align-items: center; justify-content: center; gap: 56px; }
#app { position: relative; width: 100%; height: 100dvh; overflow: hidden; background: var(--paper); }
.aside { display: none; color: #fff; max-width: 340px; }
@media (min-width: 760px) {
  #stage { padding: 32px; }
  #app { width: 390px; height: 844px; border-radius: 44px; box-shadow: 0 0 0 10px #222, 0 30px 80px rgba(0,0,0,0.5); --top: 20px; --bottom: 12px; }
  .aside { display: block; }
}
.shot #stage { display: block; padding: 0; }
.shot #app { margin: 0 auto; width: 390px; height: 844px; border-radius: 0; box-shadow: none; --top: 0px; --bottom: 0px; }
.shot .aside { display: none; }
.aside h1 { font-family: 'Instrument Sans', sans-serif; font-size: 44px; line-height: 1; letter-spacing: -1.6px; margin: 0 0 16px; }
.aside p { color: #BDBCB6; margin: 0 0 12px; }

.screen { position: absolute; inset: 0; display: flex; flex-direction: column; }
.fade { animation: fade .45s ease both; } .up { animation: up .3s ease both; }
.rise { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
@keyframes up { from { transform: translateY(24px); opacity: 0 } to { transform: none; opacity: 1 } }
@keyframes rise { from { transform: translateY(14px); opacity: 0 } to { transform: none; opacity: 1 } }
@keyframes spin { to { transform: rotate(360deg) } }
@keyframes kb { from { transform: scale(1.08) } to { transform: scale(1) } }
@keyframes most { from { transform: translateX(-28px); opacity: 0; filter: blur(6px) } to { transform: none; opacity: 1; filter: none } }
@keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.4); } 100% { transform: scale(1); } }
@keyframes line { from { opacity: 0; transform: translateY(18px); filter: blur(4px) } to { opacity: 1; transform: none; filter: none } }

.logo { font-family: 'Instrument Sans', sans-serif; line-height: 1; white-space: nowrap; }
.logo i { font-style: italic; font-weight: 500; } .logo b { font-weight: 600; } .logo s { text-decoration: none; color: var(--green); font-weight: 700; display: inline-block; }
.disp { font-family: var(--serif); font-weight: 500; line-height: 1.02; letter-spacing: -.6px; }
.disp-i { font-family: var(--serif); font-style: italic; font-weight: 400; line-height: 1.04; letter-spacing: -.4px; color: var(--green); }
.kicker { font-size: 12px; font-weight: 600; letter-spacing: 1.6px; text-transform: uppercase; }
.muted { color: var(--muted); }
.h1 { margin: 0; font-family: var(--serif); font-weight: 500; font-size: 32px; line-height: 1.1; letter-spacing: -.5px; }
.serif { font-family: var(--serif); }
.sec { font-family: var(--serif); font-size: 22px; font-weight: 500; margin: 8px 4px 0; letter-spacing: -.2px; }
.stat { background: #fff; border-radius: 18px; padding: 12px 14px; flex: 1; }
.stat b { display: block; font-family: var(--serif); font-weight: 500; font-size: 25px; line-height: 1.05; white-space: nowrap; }
.stat span { font-size: 13px; color: var(--muted); }
.lrow { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 0; border-bottom: 1px solid var(--soft); text-align: left; min-height: 52px; }
.lrow:last-child { border-bottom: 0; }
.lrow .ph { font-size: 22px; flex: none; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-cell { aspect-ratio: 1 / 1.15; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 6px; gap: 4px; font-size: 14px; font-weight: 600; background: transparent; }
.cal-cell.in { background: #fff; }
.cal-cell.sel { outline: 2px solid var(--ink); }
.cal-cell.today { background: var(--ink); color: #fff; }

.photo { position: relative; overflow: hidden; background: #0B0B0B; flex: none; }
.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.photo .scrim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.42) 0%, rgba(0,0,0,.18) 35%, rgba(0,0,0,.92) 100%); }
.photo .in { position: absolute; inset: 0; padding: calc(var(--top) + 18px) 20px 20px; display: flex; flex-direction: column; color: #fff; }

.btn { height: 54px; border-radius: 27px; font-weight: 600; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; width: 100%; transition: background .2s, color .2s; }
.btn-ink { background: var(--ink); color: #fff; }
.btn-out { background: #fff; color: var(--ink); border: 1.5px solid var(--line); }
.btn-green { background: var(--green); color: var(--ink); font-weight: 700; }
.btn-ghost { color: #fff; border: 1.5px solid rgba(255,255,255,.7); }
.btn[disabled] { background: #DAD7CF; color: #77756F; cursor: default; }
.row { display: flex; gap: 8px; }
.row > * { flex: 1; }
.icon-btn { width: 44px; height: 44px; border-radius: 22px; background: #fff; display: flex; align-items: center; justify-content: center; flex: none; color: var(--ink); }
.card { background: #fff; border-radius: 22px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; font-size: 13px; font-weight: 700; color: #fff; }
.tag { flex: none; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 8px; background: var(--soft); color: #3A3A36; }
.tag.g { background: var(--green); color: var(--ink); } .tag.c { background: #E9EEF6; color: var(--cal); }
.opt { display: flex; align-items: center; gap: 12px; text-align: left; padding: 14px 16px; border-radius: 18px; background: #fff; border: 2px solid transparent; width: 100%; min-height: 58px; transition: border-color .15s; }
.opt.on { border-color: var(--ink); }
.opt .ph { font-size: 24px; flex: none; }
.tile { display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 14px; padding: 16px; border-radius: 20px; background: #fff; border: 2px solid transparent; min-height: 108px; text-align: left; font-weight: 600; }
.tile .ph { font-size: 32px; }
.tile.on { border-color: var(--ink); }
.dot { width: 12px; height: 12px; border-radius: 6px; flex: none; }
.check { width: 22px; height: 22px; flex: none; border-radius: 11px; border: 2px solid #CDCAC2; }
.check.sq { border-radius: 7px; }
.on .check { border: 7px solid var(--ink); } .on .check.sq { border: 0; background: var(--ink); }
.pill { min-height: 42px; padding: 0 14px; border-radius: 21px; background: #fff; font-size: 14px; font-weight: 600; white-space: nowrap; flex: none; display: inline-flex; align-items: center; gap: 6px; }
.pill.on { background: var(--ink); color: #fff; }
.bars { display: flex; align-items: flex-end; gap: 3px; }
.bars span { display: block; border-radius: 4px; }
.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }
.scroll > * { flex-shrink: 0; }
.field { width: 100%; height: 56px; border-radius: 16px; border: 1.5px solid var(--line); background: #fff; padding: 0 16px; font-size: 20px; }
.field:focus { outline: none; border-color: var(--ink); }
.nav { position: absolute; left: 0; right: 0; bottom: 0; height: calc(64px + var(--bottom)); padding: 4px 24px var(--bottom); background: var(--paper); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(3, 1fr); }
.nav button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 13px; color: #8F8E88; font-weight: 500; }
.nav button .ph { font-size: 22px; }
.nav button.on { color: var(--ink); font-weight: 700; }
.sheet-bg { position: absolute; inset: 0; background: rgba(0,0,0,.5); animation: fade .2s ease; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 88%; background: var(--paper); border-radius: 28px 28px 0 0; padding: 10px 18px calc(22px + var(--bottom)); display: flex; flex-direction: column; gap: 12px; animation: up .28s ease; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: #CDCAC2; align-self: center; flex: none; }
.sheet h2 { margin: 0; font-family: var(--serif); font-weight: 500; font-size: 26px; letter-spacing: -.3px; line-height: 1.15; }
.spinner { width: 22px; height: 22px; border-radius: 11px; border: 2.5px solid var(--line); border-top-color: var(--ink); animation: spin .8s linear infinite; flex: none; }
.toast { position: absolute; left: 16px; right: 16px; bottom: calc(96px + var(--bottom)); background: var(--ink); color: #fff; border-radius: 18px; padding: 14px 16px; display: flex; align-items: center; gap: 10px; animation: up .25s ease; z-index: 5; }
.toast button { color: var(--green); font-weight: 700; min-height: 36px; }
.hint { position: relative; background: var(--ink); color: #fff; border-radius: 16px; padding: 14px 16px; display: flex; gap: 10px; align-items: flex-start; font-size: 15px; }
.hint:after { content: ''; position: absolute; top: -7px; left: 28px; width: 14px; height: 14px; background: var(--ink); transform: rotate(45deg); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.strip { display: flex; gap: 6px; flex-wrap: wrap; min-height: 28px; }
.strip span { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 10px; border-radius: 14px; background: #fff; font-size: 13px; font-weight: 600; animation: pop .35s ease both; }
.daydot { width: 40px; height: 52px; border-radius: 14px; background: #fff; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 13px; }
.daydot.on { background: var(--ink); color: #fff; }
</style>
</head>
<body>
<div id="stage">
  <div id="app"></div>
  <div class="aside">
    <h1><span class="logo"><i>Most</i> <b>Days</b><s>.</s></span></h1>
    <p>Be your own coach. A training plan that bends around your life.</p>
    <p>Open this page on your iPhone, tap Share, then Add to Home Screen.</p>
  </div>
</div>
<script>
'use strict';
var PH = {
  hero: 'photos/hero.jpg', tempo: 'photos/tempo.jpg', easy: 'photos/bridge.jpg', sprint: 'photos/sprint.jpg', rest: 'photos/sea.jpg',
  legs: 'photos/legs.jpg', group: 'photos/group.jpg', night: 'photos/night.jpg', swim1: 'photos/swim1.jpg', swim2: 'photos/swim2.jpg',
  swim3: 'photos/swim3.jpg', lift: 'photos/lift.jpg', laces: 'photos/laces.jpg', monsoon: 'photos/monsoon.jpg'
};
var params = new URLSearchParams(location.search);
if (params.get('shot')) document.documentElement.className = 'shot';
var SCEN = params.get('sync') || 'clean';

/* ---------- sports ---------- */
var SPORTS = {
  run: { name: 'Running', short: 'Run', icon: 'ph-person-simple-run', col: '#D1495B' },
  str: { name: 'Strength', short: 'Strength', icon: 'ph-barbell', col: '#4B3FA8' },
  swim: { name: 'Swimming', short: 'Swim', icon: 'ph-person-simple-swim', col: '#0E8F9C' },
  cycle: { name: 'Cycling', short: 'Ride', icon: 'ph-bicycle', col: '#C9822B' },
  yoga: { name: 'Yoga', short: 'Yoga', icon: 'ph-person-simple-tai-chi', col: '#6A4C93' },
  hike: { name: 'Walking or hiking', short: 'Walk', icon: 'ph-mountains', col: '#3F7D58' },
  football: { name: 'Football', short: 'Football', icon: 'ph-soccer-ball', col: '#2F6FED' },
  racquet: { name: 'Racquet sports', short: 'Play', icon: 'ph-tennis-ball', col: '#5E8A1E' }
};
var SPORT_KEYS = ['run', 'str', 'swim', 'cycle', 'yoga', 'hike', 'football', 'racquet'];
function sp(k) { return SPORTS[k] || SPORTS.run; }
function icon(name, size, color) { return '<i class="ph ' + name + '" aria-hidden="true" style="font-size:' + (size || 20) + 'px' + (color ? ';color:' + color : '') + '"></i>'; }

/* ---------- workouts: blocks are [label, detail, intensity 1-5, minutes] ---------- */
var W = {
  tempo: { sport: 'run', a: '6 km', b: 'tempo', dist: '6 km', photo: PH.tempo, stat: '5.2 km in 31 min', music: true,
    blocks: [['Warm-up', '1 km, easy', 1, 7], ['Tempo', '4 km at 5:10 /km, comfortably hard', 3, 21], ['Cool-down', '1 km, easy', 1, 7]] },
  shortTempo: { sport: 'run', a: '4 km', b: 'short tempo', dist: '4 km', photo: PH.tempo, stat: '4.1 km in 24 min', music: true,
    blocks: [['Warm-up', '1 km, easy', 1, 7], ['Tempo', '2 km at 5:10 /km', 3, 10], ['Cool-down', '1 km, easy', 1, 7]] },
  progression: { sport: 'run', a: '5 km', b: 'progression', dist: '5 km', photo: PH.tempo, stat: '5.0 km in 30 min', music: true,
    blocks: [['Easy', '2 km', 1, 13], ['Steady', '2 km', 2, 12], ['Tempo', 'Last 1 km only', 3, 5]] },
  easy: { sport: 'run', a: '5 km', b: 'easy', dist: '5 km', photo: PH.easy, stat: '5.1 km in 32 min', music: true,
    blocks: [['Easy', '5 km, chatty pace', 1, 33]] },
  strides: { sport: 'run', a: '5 km easy', b: 'with strides', dist: '5 km', photo: PH.easy, stat: '5.2 km in 35 min', music: true,
    blocks: [['Easy', '5 km', 1, 31], ['Strides', '6 × 20 s quick, walk back', 3, 4]] },
  tiny: { sport: 'run', a: '15 min', b: 'around the block', dist: 'About 2 km', photo: PH.easy, stat: '2.4 km in 15 min', music: true,
    blocks: [['Easy', 'Walk home if it still feels bad', 1, 15]] },
  easyRun: { sport: 'run', a: '30 min', b: 'easy run', dist: 'About 5 km', photo: PH.sprint, stat: '4.8 km in 30 min', music: true,
    blocks: [['Easy', 'A pace you could chat at', 1, 30]] },
  runWalk: { sport: 'run', a: '20 min', b: 'run-walk', dist: 'About 2.5 km', photo: PH.easy, stat: '2.6 km in 20 min', music: true,
    blocks: [['Walk', '5 min to warm up', 1, 5], ['Run 1, walk 1', '5 rounds', 2, 10], ['Walk', '5 min', 1, 5]] },
  longRun: { sport: 'run', a: '50 min', b: 'long easy run', dist: 'About 8 km', photo: PH.group, stat: '8.1 km in 50 min', music: true,
    blocks: [['Easy', 'Slow is the point', 1, 50]] },
  strength: { sport: 'str', a: '40 min', b: 'full body', dist: 'No distance', photo: PH.lift, stat: '42 min',
    blocks: [['Warm-up', 'Mobility', 1, 8], ['Main', 'Squat, push, pull, hinge, 3 rounds', 3, 26], ['Core', '2 rounds', 2, 6]] },
  core: { sport: 'str', a: 'Core', b: 'and mobility', dist: 'No distance', photo: PH.lift, stat: '22 min',
    blocks: [['Mobility', 'Hips and calves', 1, 10], ['Core', '3 rounds', 2, 12]] },
  swim: { sport: 'swim', a: '1,000 m', b: 'swim', dist: '1,000 m', photo: PH.swim1, stat: '1,000 m in 36 min', lengths: true,
    tip: 'Breathe every 3 strokes. Long and slow beats short and fast. Stop at the wall as often as you like.',
    blocks: [['Warm-up', '200 m easy, any stroke', 1, 8], ['Kick drills', '4 × 50 m with a board', 2, 8], ['Main set', '6 × 50 m freestyle, 30 s rest', 3, 14], ['Cool-down', '100 m easy', 1, 5]] },
  swimLesson: { sport: 'swim', a: '30 min', b: 'easy swim', dist: 'About 600 m', photo: PH.swim3, stat: '600 m in 30 min', lengths: true,
    tip: 'Stop at the wall whenever you like. Today is about feeling at home in the water.',
    blocks: [['Easy', 'Any stroke', 1, 10], ['Kick drills', 'With a board', 2, 10], ['Easy', 'Any stroke', 1, 10]] },
  swimShort: { sport: 'swim', a: '600 m', b: 'shorter swim', dist: '600 m', photo: PH.swim1, stat: '600 m in 22 min', lengths: true,
    blocks: [['Warm-up', '100 m easy', 1, 4], ['Kick drills', '4 × 50 m', 2, 8], ['Easy', '300 m', 1, 10]] },
  drills: { sport: 'swim', a: '500 m', b: 'drills only', dist: '500 m', photo: PH.swim3, stat: '500 m in 20 min', lengths: true,
    blocks: [['Kick', '4 × 50 m', 2, 8], ['Catch-up drill', '4 × 50 m', 2, 8], ['Easy', '100 m', 1, 4]] },
  ride: { sport: 'cycle', a: '45 min', b: 'easy ride', dist: 'About 15 km', photo: PH.monsoon, stat: '15 km in 46 min',
    blocks: [['Easy', 'Spin, don’t push', 1, 45]] },
  yoga: { sport: 'yoga', a: '30 min', b: 'yoga', dist: 'No distance', photo: PH.rest, stat: '30 min',
    blocks: [['Flow', 'Hips, hamstrings, back', 1, 30]] },
  hike: { sport: 'hike', a: '40 min', b: 'brisk walk', dist: 'About 4 km', photo: PH.monsoon, stat: '4.2 km in 41 min',
    blocks: [['Brisk', 'Arms swinging', 1, 40]] },
  football: { sport: 'football', a: '60 min', b: 'football', dist: 'No distance', photo: PH.group, stat: '60 min',
    blocks: [['Play', 'Have fun', 2, 60]] },
  racquet: { sport: 'racquet', a: '60 min', b: 'game', dist: 'No distance', photo: PH.group, stat: '60 min',
    blocks: [['Play', 'Have fun', 2, 60]] }
};
var EASY_OF = { run: 'easyRun', str: 'core', swim: 'swimLesson', cycle: 'ride', yoga: 'yoga', hike: 'hike', football: 'hike', racquet: 'yoga' };
var EFF = ['', 'Easy', 'Steady', 'Hard', 'Very hard', 'All out'];
function mins(k) { return W[k].blocks.reduce(function (a, b) { return a + b[3]; }, 0); }
function peak(k) { return W[k].blocks.reduce(function (a, b) { return Math.max(a, b[2]); }, 0); }
function op(i) { return i <= 1 ? 0.35 : i === 2 ? 0.6 : 1; }
function wname(k) { return W[k].a + ' ' + W[k].b; }
function bars(k, h) {
  var c = sp(W[k].sport).col;
  return '<div class="bars" aria-hidden="true" style="height:' + h + 'px">' + W[k].blocks.map(function (b) {
    return '<span style="flex:' + b[3] + ';height:' + (24 + b[2] * 19) + '%;background:' + c + ';opacity:' + op(b[2]) + '"></span>';
  }).join('') + '</div>';
}

/* ---------- state ---------- */
var DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
var TODAY_IDX = 2; // Wed 14 Oct 2026
function fresh() {
  return {
    scr: 'splash', introStep: 0, step: 0,
    name: '', age: null, work: {}, motive: null, primary: null, others: {}, level: null,
    hasRace: null, raceName: '', raceDate: '', days: {}, slot: {}, life: {}, body: null, where: {}, why: '', conn: {},
    buildStep: 0, phase: 'day1', hintSeen: false, firstDone: false,
    sessions: null, active: 0, from: 'today', prev: null, done: {}, feel: {},
    sheet: null, reason: null, opt: null, cant: null, moveDay: null, offVal: null, journal: '', toast: '', shareStyle: 0, planTab: 0,
    calOn: { wedding: 1, amma: 1, trip: 1, diwali: 1 }, nudge: {}, journalLog: [], inspo: [], calMonth: 0, calSel: null, editFrom: null, noteKind: 'note', noteDraft: ''
  };
}
var S, P;
function loadProfile(id) { try { return Object.assign(fresh(), JSON.parse(localStorage.getItem('mostdays.p.' + id)) || {}); } catch (e) { return fresh(); } }
try { P = JSON.parse(localStorage.getItem('mostdays.profiles')); } catch (e) { P = null; }
if (!P || !P.list || !P.list.length) P = { list: [{ id: 'p1', name: '' }], cur: 'p1' };
S = loadProfile(P.cur);
if (params.get('reset')) { S = fresh(); P = { list: [{ id: 'p1', name: '' }], cur: 'p1' }; }
function addProfile() { save(); var id = 'p' + Date.now(); P.list.push({ id: id, name: '' }); P.cur = id; S = fresh(); S.scr = 'onb'; S.step = 0; render(); }
function switchProfile(id) { save(); P.cur = id; S = loadProfile(id); S.sheet = null; S.scr = S.sessions ? 'today' : 'onb'; render(); }
if (['splash', 'intro', 'build'].indexOf(S.scr) > -1 || S.sheet) { S.sheet = null; if (S.scr !== 'splash' && S.scr !== 'intro') S.scr = S.sessions ? 'today' : 'splash'; }
if (S.scr === 'splash' || S.scr === 'intro') S.introStep = 0;
function save() {
  try {
    localStorage.setItem('mostdays.p.' + P.cur, JSON.stringify(Object.assign({}, S, { toast: '' })));

      (S.reason === 'early' && S.conn.cal ? '<div style="display:flex;align-items:center;gap:8px;font-size:14px;color:var(--cal);flex:none">' + icon('ph-calendar-blank', 16) + (S.phase === 'day7' ? 'From your calendar: Amma’s check-up, tomorrow 8 am' : 'From your calendar: a 7:30 am meeting tomorrow') + '</div>' : '') +
      '<div class="scroll" style="display:flex;flex-direction:column;gap:12px;min-height:0">' + groups.map(function (g) {
        return '<div><div class="kicker muted" style="font-size:12px;margin-bottom:6px">' + g[0] + '</div><div style="display:flex;flex-direction:column;gap:6px">' + g[1].map(function (ok) {
          var on = picked === ok, ow = W[ok];
          return '<button class="opt' + (on ? ' on' : '') + '" style="padding:12px 14px" aria-pressed="' + on + '" ' + h(function () { set({ opt: ok }); }) + '><span style="width:64px;flex:none">' + bars(ok, 30) + '</span>' +
            '<span style="flex:1"><span style="display:block;font-weight:600">' + wname(ok) + '</span><span class="muted" style="display:block;font-size:13px">' + mins(ok) + ' min, ' + EFF[peak(ok)].toLowerCase() + (ow.sport !== W[sess(S.active).base].sport ? ', ' + sp(ow.sport).short.toLowerCase() : '') + '</span></span>' +
            (rec === ok ? '<span class="tag g" style="font-size:11px">Suggested</span>' : '') + '</button>';
        }).join('') + '</div></div>';
      }).join('') + '</div>' +
      '<button class="btn btn-ink" style="flex:none" ' + (picked ? '' : 'disabled ') + h(function () {
        if (!picked) return;
        var snap = snapshot(), list = JSON.parse(JSON.stringify(S.sessions)); list[S.active].key = picked;
        Object.assign(S, { prev: snap, sessions: list, sheet: null, reason: null, opt: null, scr: 'workout' });
        toastMsg('Changed to ' + wname(picked) + '.');
      }) + '>' + (picked ? 'Use ' + wname(picked) : 'Pick one') + '</button>';
  }
  if (sh === 'cant') {
    title = 'That’s okay. What would help?';
    var free = [0, 1, 2, 3, 4, 5, 6].filter(function (d) { return d > TODAY_IDX && !S.sessions.some(function (y) { return y.day === d; }); }).slice(0, 2);
    var moveOpts = free.map(function (d) { return [d, DAYS[d], 'Free']; });
    var nxt = S.sessions.find(function (y) { return y.day > TODAY_IDX; });
    if (nxt && moveOpts.length < 3) moveOpts.push([nxt.day, DAYS[nxt.day], 'Swap days']);
    moveOpts.sort(function (a, b) { return a[0] - b[0]; });
    moveOpts = moveOpts.map(function (m) { var ev = calEventsOn(ymd(addD(weekMon(), m[0])))[0]; return ev ? [m[0], m[1], ev[1].split(' ').pop().replace(/^./, function (c) { return c.toUpperCase(); }), true] : m; });
    body = [['move', 'Move it', 'Pick another day this week', 'ph-arrow-bend-up-right'], ['short', 'Do a tiny one', '15 minutes, easy', 'ph-timer'], ['skip', 'Skip it', 'Rest is part of it', 'ph-moon']].map(function (o) {
      var on = S.cant === o[0];
      return '<button class="opt' + (on ? ' on' : '') + '" aria-pressed="' + on + '" ' + h(function () { set({ cant: o[0], moveDay: null }); }) + '>' + icon(o[3], 24) + '<span style="flex:1"><span style="display:block;font-weight:600;font-size:17px">' + o[1] + '</span><span class="muted" style="display:block;font-size:14px">' + o[2] + '</span></span><span class="check"></span></button>';
    }).join('');
    if (S.cant === 'move') body += '<div class="row">' + moveOpts.map(function (m) {
      var on = S.moveDay === m[0], dis = !!m[3];
      return '<button ' + (dis ? 'disabled ' : '') + 'aria-pressed="' + on + '" style="min-height:58px;border-radius:16px;' + (dis ? 'color:#9A9890;border:1.5px dashed #CDCAC2;cursor:default' : on ? 'background:var(--ink);color:#fff' : 'background:#fff') + '" ' + (dis ? '' : h(function () { set({ moveDay: m[0] }); })) + '><span style="display:block;font-weight:600">' + m[1] + '</span><span style="display:block;font-size:12px">' + m[2] + '</span></button>';
    }).join('') + '</div>';
    var ready = S.cant === 'short' || S.cant === 'skip' || (S.cant === 'move' && S.moveDay != null);
    if (ready) body += green(S.cant === 'move' ? 'Move it' : S.cant === 'short' ? 'Use the 15 min version' : 'Skip today', function () {
      var snap = snapshot(), list = JSON.parse(JSON.stringify(S.sessions)), cur = list[S.active];
      if (S.cant === 'move') {
        var tgt = S.moveDay, other = list.find(function (y) { return y.day === tgt; });
        var moved = { day: tgt, key: cur.key, base: cur.base };
        if (other) { other.day = cur.day; list.push({ day: cur.day, key: cur.key, base: cur.base, rest: 'moved', movedTo: tgt }); list.splice(list.indexOf(cur), 1); list.push(moved); }
        else { cur.rest = 'moved'; cur.movedTo = tgt; list.push(moved); }
        list.sort(function (a, b) { return a.day - b.day || (a.rest ? -1 : 1); });
        Object.assign(S, { prev: snap, sessions: list, sheet: 'moved', cant: null, moveDay: null, movedName: DAYS[tgt] });
        render();
      } else if (S.cant === 'short') {
        cur.key = W[cur.base].sport === 'run' ? 'tiny' : W[cur.base].sport === 'swim' ? 'drills' : 'core';
        Object.assign(S, { prev: snap, sessions: list, sheet: null, cant: null }); toastMsg('Changed to a shorter one.');
      } else { cur.rest = 'skipped'; Object.assign(S, { prev: snap, sessions: list, sheet: null, cant: null }); toastMsg('Skipped. Nothing else changes.'); }
    });
  }
  if (sh === 'moved') {
    title = 'Moved to ' + (S.movedName || 'later');
    body = '<div style="font-size:16px;color:#3A3A36">Today is rest. The rest of the week shifts around it.</div>' +
      '<a class="btn btn-out" target="_blank" rel="noopener" href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(wname(sess(todayIndex()).base) + ' (Most Days)') + '&dates=20261016T004500Z/20261016T012000Z">' + icon('ph-calendar-plus', 18) + 'Add to Google Calendar</a>' +
      green('Done', function () { set({ sheet: null }); });
  }
  return '<button class="sheet-bg" aria-label="Close" ' + h(function () { clearTimeout(tSync); set({ sheet: null }); }) + '></button><div class="sheet" role="dialog" aria-label="' + esc(title) + '"><div class="grab"></div><h2>' + title + '</h2>' + body + '</div>';
}

/* ---------- render ---------- */
var app = document.getElementById('app');
function render() {
  H = [];
  var scr = S.scr, html;
  if (scr === 'splash') html = splash();
  else if (scr === 'intro') html = intro();
  else if (scr === 'onb') html = onb();
  else if (scr === 'build') html = build();
  else if (scr === 'workout') html = workout();
  else if (scr === 'done') html = doneScreen();
  else if (scr === 'share') html = share();
  else if (scr === 'why') html = whyView();
  else html = appShell();
  html += sheet();
  var inApp = ['today', 'calendar', 'plan', 'you', 'workout', 'why'].indexOf(scr) > -1;
  if (S.toast && inApp) html += '<div class="toast" role="status"><span style="flex:1;font-size:15px">' + esc(S.toast) + '</span>' + (S.prev ? '<button ' + h(undo) + '>Undo</button>' : '') + '</div>';
  app.innerHTML = html;
  if (scr === 'intro') scheduleIntro();
  save();
}
app.addEventListener('click', function (e) {
  var el = e.target.closest('[data-h]');
  if (!el || el.disabled) return;
  var fn = H[+el.getAttribute('data-h')];
  if (fn) fn();
});
app.addEventListener('input', function (e) {
  var k = e.target.getAttribute('data-in');
  if (!k) return;
  S[k] = e.target.value; save();
  if (S.scr === 'onb') {
    var nb = app.querySelector('[data-next]');
    var id = STEPS[S.step].id;
    if (nb) { nb.disabled = !valid(id); if (id === 'why') nb.textContent = S.why.trim() ? 'Continue' : 'Skip'; }
    var strip = app.querySelector('.strip'); if (strip && id === 'name') strip.innerHTML = '';
  }
});
app.addEventListener('change', function (e) { if (e.target.getAttribute('data-in') === 'raceDate' && S.scr === 'onb') render(); });
function scheduleSplash() { if (S.scr === 'splash') setTimeout(function () { if (S.scr === 'splash') set({ scr: 'intro', introStep: 0 }); }, 2200); }

// Demo links for presenting: ?demo=day1|day7&screen=today|week|plan|workout|change|cant|done|share|swimsync|onb
(function () {
  var d = params.get('demo'), scr = params.get('screen');
  if (!d && !scr) return;
  if (d === 'day1' || d === 'day7' || scr) {
    demoAccount();
    if (d === 'day1') { S.phase = 'day1'; S.sessions = buildWeek(); S.done = {}; S.hintSeen = false; S.firstDone = false; S.why = ''; S.conn = { cal: 1 }; }
  }
  var ti = todayIndex();
  var map = {
    today: { scr: 'today' }, plan: { scr: 'plan' }, week: { scr: 'calendar' }, calendar: { scr: 'calendar' }, you: { scr: 'you' }, why: { scr: 'why' }, workout: { scr: 'workout', active: ti },
    change: { scr: 'workout', active: ti, sheet: 'change', reason: 'early' },
    cant: { scr: 'today', active: ti, sheet: 'cant', cant: 'move' },
    done: { scr: 'done', active: ti }, share: { scr: 'share', active: ti },
    swimsync: { scr: 'workout', active: S.sessions.findIndex(function (x) { return W[x.key].sport === 'swim'; }), sheet: 'off' },
    onb: { scr: 'onb', step: +(params.get('step') || 0) }
  };
  if (scr === 'onb') { var keep = S; S = fresh(); if (params.get('step')) { S.name = 'Anmol'; } S.scr = 'onb'; S.step = +(params.get('step') || 0); }
  else if (map[scr]) Object.assign(S, map[scr]);
})();
render();
scheduleSplash();
</script>
</body>
</html>
